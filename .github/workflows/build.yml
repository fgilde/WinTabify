name: Build and publish WinTabify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test WinTabify.slnx -c Release
      - name: Build portable packages
        shell: pwsh
        run: |
          ./scripts/package.ps1 -Runtime win-x64
          ./scripts/package.ps1 -Runtime win-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: WinTabify-Windows
          path: docs/downloads/*.zip
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: docs

  pages:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the bilingual site
        id: deployment
        uses: actions/deploy-pages@v4
