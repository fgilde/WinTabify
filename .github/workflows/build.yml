name: Build and publish WinTabify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: WinTabify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  explorer:
    uses: ./.github/workflows/explorer.yml

  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test WinTabify.slnx -c Release

  package:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [win-x64, win-arm64]
        flavor: [bundled, slim]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet tool restore
      - name: Build and verify single-file app, installer and update feed
        shell: pwsh
        run: ./scripts/package.ps1 -Runtime ${{ matrix.runtime }} -Flavor ${{ matrix.flavor }} -Version "0.2.$env:GITHUB_RUN_NUMBER"
      - name: Upgrade and restart a previous portable build
        if: matrix.runtime == 'win-x64' && matrix.flavor == 'slim'
        shell: pwsh
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: ./scripts/test-update.ps1 -Version "0.2.$env:GITHUB_RUN_NUMBER"
      - uses: actions/upload-artifact@v4
        with:
          name: downloads-${{ matrix.runtime }}-${{ matrix.flavor }}
          path: docs/downloads/
          compression-level: 0

  pages:
    needs: [test, package, explorer]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: downloads-*
          path: docs/downloads
          merge-multiple: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy the bilingual site and update feeds
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the published installers, portable downloads and updates
        env:
          SITE: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${SITE%/}/downloads"
          for runtime in win-x64 win-arm64; do
            for flavor in bundled slim; do
              channel="$runtime-$flavor"
              feed="$base/$channel"
              json=$(curl -fsSL --retry 5 --retry-all-errors "$feed/releases.$channel.json?run=$GITHUB_RUN_ID")
              package=$(jq -er --arg v "0.2.$GITHUB_RUN_NUMBER" '.Assets[] | select(.Type == "Full" and .Version == $v) | .FileName' <<<"$json")
              suffix=""
              if [[ "$flavor" == slim ]]; then suffix="-slim"; fi
              for file in "$feed/WinTabify-Setup.exe" "$feed/$package" "$base/WinTabify-$runtime$suffix.zip"; do
                curl -fsSIL --retry 5 --retry-all-errors "$file?run=$GITHUB_RUN_ID" -o /dev/null
              done
            done
          done
